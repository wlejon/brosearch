name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The library has no sibling dependencies: the standard library and threads
# are all it needs. Its JavaScript api (brosearch_api, BROSEARCH_ENABLE_API,
# on when brosearch is the top-level project) binds bronze, which, with brass,
# comes from the commit CMakeLists.txt pins (cmake/bro_deps.cmake), fetched at
# configure: every job builds a plain clone. bronze and brass compile inside
# this build tree with the job's own compiler and CRT, which makes brosearch_test_api the check that the library works the
# way bro uses it.
#
# The suites carry oracle-derived expectations (fzf, rg and git output recorded
# under tests/fixtures/), so none of those tools has to be installed here. The
# live differential runners in scripts/ need the real tools and are not run in
# CI, and neither is brosearch-cli as a benchmark: hosted-runner timings say
# nothing about the engine.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Release }
          - { name: linux-clang,        os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release }
          - { name: windows-msvc,       os: windows-2022,                          config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022,                          config: Debug }
          - { name: macos-arm64,        os: macos-15,                              config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brosearch

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brosearch -B build
          else
            cmake -S brosearch -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -j 2

      # ctest shows a passing test's output nowhere, so the walk specs a
      # platform cannot hold (POSIX-only, macOS-only, names APFS refuses) are
      # listed in the job summary: a skip is only honest if someone can read why.
      - name: Skip reasons
        if: always()
        shell: bash
        run: |
          { echo "### Skipped (${{ matrix.name }})"; echo '```'
            grep -hiE '\bskip(ped)?\b' build/Testing/Temporary/LastTest*.log || echo none
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Scoped to src/ and include/. Debug (-O0), so this is also the Linux job
  # where assert()s are live.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brosearch

      - name: Install gcovr + Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcovr ninja-build

      - name: Configure (instrumented)
        run: |
          cmake -S brosearch -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROSEARCH_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 2

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      #
      # Run from the workspace root, where build/ is, with the filters spelled
      # brosearch/...: gcovr only looks for .gcda files under its root.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brosearch/src/' --filter 'brosearch/include/brosearch/' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/` + `include/brosearch/`'
            echo
            echo 'Linux only: the Windows and macOS paths (wide-character paths, case-insensitive volumes, NFD precomposition) are exercised by the test matrix, not measured.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
